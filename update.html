
<!DOCTYPE html>
<html>
<head>
    <title>Update Student</title>
</head>
<body>

<h2>Update Student Details</h2>

<form method="POST">

    Name:
    <input type="text" name="name"
           value="{{ record[1] }}" required>
    <br><br>

    Course:
    <input type="text" name="course"
           value="{{ record[2] }}" required>
    <br><br>

    <button type="submit">Update</button>

</form>

</body>
</html>
